# /etc/sysctl.d/99-alameer-performance.conf
# Alameer Software OS - 64MB RAM High Load Tuning

# --- إدارة الذاكرة ---
vm.min_free_kbytes = 8192
vm.swappiness = 10
vm.vfs_cache_pressure = 50

# --- اتصالات Conntrack ---
net.netfilter.nf_conntrack_max = 16384
net.netfilter.nf_conntrack_buckets = 2048
net.netfilter.nf_conntrack_tcp_timeout_established = 7440
net.netfilter.nf_conntrack_tcp_timeout_time_wait = 120
net.netfilter.nf_conntrack_udp_timeout = 60
net.netfilter.nf_conntrack_udp_timeout_stream = 180

# --- مخازن الشبكة المؤقتة ---
net.core.rmem_default = 65536
net.core.wmem_default = 65536
net.core.rmem_max = 131072
net.core.wmem_max = 131072
net.ipv4.tcp_rmem = 4096 87380 131072
net.ipv4.tcp_wmem = 4096 65536 131072

# --- تحسينات TCP ---
net.ipv4.tcp_fin_timeout = 30
net.ipv4.tcp_keepalive_time = 300
net.ipv4.tcp_keepalive_probes = 5
net.ipv4.tcp_keepalive_intvl = 15

name: Build Alameer OpenWrt 24.10

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]

permissions:
  contents: write

env:
  OPENWRT_VERSION: "24.10.8"
  TARGET: "ramips"
  SUBTARGET: "mt76x8"
  PROFILE: "tplink_re205-v3"
  MAX_IMAGE_BYTES: "6000000"
  # Experimental: build a custom regulatory.db containing country "ZZ" (see README).
  SUPER_REGDB: "false"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Validate project files
        shell: bash
        run: |
          set -euo pipefail
          test -f files/etc/uci-defaults/99-custom-config || { echo "Missing files/etc/uci-defaults/99-custom-config" >&2; exit 1; }
          test -f scripts/inject-theme-assets.sh || { echo "Missing scripts/inject-theme-assets.sh" >&2; exit 1; }
          test -f files/www/luci-static/bootstrap/alameer.css
          test -f files/www/luci-static/resources/alameer.js
          test -f files/www/luci-static/resources/logo.png
          test -f files/usr/bin/alameer-reset-wireless
          for f in files/usr/libexec/rpcd/alameer files/usr/sbin/alameer-loopguard files/usr/sbin/alameer-cpufreq files/etc/init.d/alameer-loopguard files/etc/init.d/alameer-cpufreq files/etc/config/alameer files/usr/share/luci/menu.d/luci-app-alameer.json files/usr/share/rpcd/acl.d/luci-app-alameer.json; do
            test -f "$f" || { echo "Missing $f" >&2; exit 1; }
          done
          for f in files/www/luci-static/resources/view/alameer/*.js; do node --check "$f" 2>/dev/null || true; done
          chmod 0755 files/etc/uci-defaults/99-custom-config files/usr/bin/alameer-reset-wireless scripts/inject-theme-assets.sh scripts/*.sh

      - name: Install build utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd file

      - name: Download official OpenWrt ImageBuilder
        shell: bash
        run: |
          set -euo pipefail
          IB="openwrt-imagebuilder-${OPENWRT_VERSION}-${TARGET}-${SUBTARGET}.Linux-x86_64"
          URL="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/${TARGET}/${SUBTARGET}/${IB}.tar.zst"
          curl --fail --location --retry 3 "$URL" -o imagebuilder.tar.zst
          mkdir imagebuilder
          tar --use-compress-program=unzstd -xf imagebuilder.tar.zst -C imagebuilder --strip-components=1
          test -f imagebuilder/Makefile
          echo "IMAGEBUILDER=$PWD/imagebuilder" >> "$GITHUB_ENV"

      - name: Prepare original Bootstrap template and inject Alameer assets
        shell: bash
        run: |
          set -euo pipefail
          cd "$IMAGEBUILDER"
          mkdir -p files/usr/share/ucode/luci/template/themes/bootstrap

          # OpenWrt feeds/CDN may serve this payload as an ar IPK, a tar-wrapped
          # IPK, or gzip-compressed tar. Normalize all supported forms before
          # extracting data.tar.*. Never assume that a .ipk suffix proves format.
          extract_theme_package() {
            local source="$1" destination="$2" payload="$1" magic
            mkdir -p "$destination"

            magic="$(od -An -tx1 -N2 "$payload" | tr -d '[:space:]')"
            if [[ "$magic" == "1f8b" ]]; then
              echo "Package payload is gzip-compressed; unpacking transport/container layer."
              gzip -t "$payload"
              payload="${payload}.ungz"
              gzip -dc "$source" > "$payload"
            fi

            if ar t "$payload" >/tmp/alameer-ar-members.txt 2>/dev/null \
              && grep -Eq '(^|/)debian-binary$' /tmp/alameer-ar-members.txt; then
              echo "Recognized Debian ar/IPK container."
              (cd "$destination" && ar x "$payload")
            elif tar -tf "$payload" >/tmp/alameer-tar-members.txt 2>/dev/null \
              && grep -Eq '(^|\./)debian-binary$' /tmp/alameer-tar-members.txt; then
              echo "Recognized tar-wrapped IPK container."
              tar -xf "$payload" -C "$destination"
            else
              echo "Unsupported luci-theme-bootstrap package container." >&2
              file "$source" >&2 || true
              echo "Payload after optional gzip decoding:" >&2
              file "$payload" >&2 || true
              echo "First 32 bytes (hex):" >&2
              od -An -tx1 -N32 "$payload" >&2 || true
              echo "Archive listing (if readable):" >&2
              cat /tmp/alameer-ar-members.txt /tmp/alameer-tar-members.txt 2>/dev/null >&2 || true
              return 1
            fi

            find "$destination" -type f -name debian-binary -print -quit | grep -q . || {
              echo "Container did not include debian-binary." >&2
              return 1
            }
            find "$destination" -type f -name 'data.tar*' -print -quit | grep -q . || {
              echo "Container did not include data.tar.*." >&2
              return 1
            }
          }

          ipk="$(find packages -type f -name 'luci-theme-bootstrap_*.ipk' -print -quit || true)"
          if [ -z "$ipk" ]; then
            # The ImageBuilder archive may include indexes but not package payloads.
            feed="https://downloads.openwrt.org/releases/packages-24.10/mipsel_24kc/luci"
            index=/tmp/alameer-luci-Packages.gz
            ipk=/tmp/luci-theme-bootstrap.ipk
            curl --fail --location --retry 3 --retry-all-errors "$feed/Packages.gz" -o "$index"
            gzip -t "$index"
            filename="$(gzip -dc "$index" | awk 'BEGIN { RS=""; FS="\n" } $1 == "Package: luci-theme-bootstrap" { for (i=1; i<=NF; i++) if ($i ~ /^Filename: /) { sub(/^Filename: /, "", $i); print $i; exit } }')"
            if [ -z "$filename" ]; then
              echo "luci-theme-bootstrap was not found in $feed/Packages.gz" >&2
              exit 1
            fi
            case "$filename" in
              /*|*..*) echo "Unsafe package path from feed index: $filename" >&2; exit 1 ;;
            esac
            # Do not use curl --compressed here: preserve the actual response
            # bytes so the container can be identified and normalized explicitly.
            curl --fail --location --retry 3 --retry-all-errors "$feed/$filename" -o "$ipk"
            echo "Downloaded package: $filename"
          else
            ipk="$IMAGEBUILDER/$ipk"
            echo "Using ImageBuilder package: $ipk"
          fi

          file "$ipk"
          rm -rf /tmp/alameer-theme-ipk /tmp/alameer-theme-data
          mkdir -p /tmp/alameer-theme-ipk /tmp/alameer-theme-data
          extract_theme_package "$ipk" /tmp/alameer-theme-ipk
          data="$(find /tmp/alameer-theme-ipk -type f -name 'data.tar*' -print -quit)"
          test -n "$data"
          tar -xf "$data" -C /tmp/alameer-theme-data
          template="$(find /tmp/alameer-theme-data -type f -path '*/usr/share/ucode/luci/template/themes/bootstrap/header.ut' -print -quit)"
          test -n "$template" || { echo "Bootstrap header template not found in package payload." >&2; exit 1; }
          install -m 0644 "$template" files/usr/share/ucode/luci/template/themes/bootstrap/header.ut
          cp -a "$GITHUB_WORKSPACE/files/." files/
          "$GITHUB_WORKSPACE/scripts/inject-theme-assets.sh" files
          test -f files/etc/uci-defaults/99-custom-config
          test -f files/usr/bin/alameer-reset-wireless
          test -f "$GITHUB_WORKSPACE/scripts/inject-theme-assets.sh"
          chmod 0755 files/etc/uci-defaults/99-custom-config files/usr/bin/alameer-reset-wireless \
            files/usr/libexec/rpcd/alameer files/usr/sbin/alameer-loopguard files/usr/sbin/alameer-cpufreq \
            files/etc/init.d/alameer-loopguard files/etc/init.d/alameer-cpufreq

      - name: Optional custom regulatory database (Super Channel "ZZ")
        if: env.SUPER_REGDB == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          "$GITHUB_WORKSPACE/scripts/build-regdb.sh" "$IMAGEBUILDER/files"

      - name: Build device firmware (with automatic size fallback)
        shell: bash
        run: |
          set -euo pipefail
          cd "$IMAGEBUILDER"
          BASE="luci-base luci-mod-admin-full luci-theme-bootstrap uhttpd uhttpd-mod-ubus -ppp -ppp-mod-pppoe -odhcpd-ipv6only -ip6tables -kmod-ip6tables -luci-app-firewall"
          # Tier 1: everything (mesh + extender + watchdog + analyzer tools)
          FULL="$BASE iw relayd kmod-batman-adv -wpad-basic-mbedtls wpad-mesh-mbedtls watchcat luci-app-watchcat"
          # Tier 2: no mesh (batman-adv/wpad-mesh dropped to save flash)
          LITE="$BASE iw relayd"
          # Tier 3: analyzer only
          MIN="$BASE iw"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          built=""
          for tier in FULL LITE MIN; do
            PK="${!tier}"
            echo "::group::Trying package tier $tier"
            rm -rf bin
            if make image PROFILE="$PROFILE" PACKAGES="$PK" FILES=files; then
              over=0
              while IFS= read -r img; do
                bytes="$(stat -c %s "$img")"; echo "$img: $bytes bytes"
                (( bytes >= MAX_IMAGE_BYTES )) && over=1
              done < <(find bin -type f -name "*${PROFILE}*squashfs-*.bin")
              if (( over == 0 )); then built="$tier"; echo "::endgroup::"; break; fi
              echo "::warning::Tier $tier exceeds ${MAX_IMAGE_BYTES} bytes; falling back to a smaller package set."
            else
              echo "::warning::Tier $tier failed to build (package unavailable or flash overflow); falling back."
            fi
            echo "::endgroup::"
          done
          [ -n "$built" ] || { echo "No package tier produced an image below the size limit." >&2; exit 1; }
          echo "Built with tier: $built" | tee "$GITHUB_WORKSPACE/dist/BUILD-TIER.txt"
          find bin -type f -name "*${PROFILE}*squashfs-*.bin" -exec cp -v {} "$GITHUB_WORKSPACE/dist/" \;
          ls -lh "$GITHUB_WORKSPACE/dist"

      - name: Enforce image size and required outputs
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          factory=(dist/*"${PROFILE}"*factory.bin)
          sysupgrade=(dist/*"${PROFILE}"*sysupgrade.bin)
          if (( ${#factory[@]} == 0 )); then
            echo "No factory image was produced for this profile; refusing to mislabel another image." >&2
            find dist -maxdepth 1 -type f -print
            exit 1
          fi
          if (( ${#sysupgrade[@]} == 0 )); then
            echo "No sysupgrade image was produced for this profile." >&2
            exit 1
          fi
          for image in "${factory[@]}" "${sysupgrade[@]}"; do
            bytes="$(stat -c %s "$image")"
            echo "$image: $bytes bytes"
            if (( bytes >= MAX_IMAGE_BYTES )); then
              echo "FAIL: $image is not strictly below 6,000,000 bytes." >&2
              exit 1
            fi
            file "$image"
          done
          (cd dist && sha256sum *.bin > SHA256SUMS)

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: alameer-openwrt-${{ env.OPENWRT_VERSION }}-${{ env.PROFILE }}
          path: |
            dist/*.bin
            dist/SHA256SUMS
            dist/BUILD-TIER.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release for version tags
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.bin
            dist/SHA256SUMS
          generate_release_notes: true

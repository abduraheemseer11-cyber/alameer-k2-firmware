name: Build ALAMEER K2 Dashboard Firmware

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags: [ "v*" ]

permissions:
  contents: write

env:
  OPENWRT_VERSION: "23.05.3"
  IB_ARCHIVE: "openwrt-imagebuilder-23.05.3-ramips-mt7620.Linux-x86_64.tar.xz"
  IB_URL: "https://downloads.openwrt.org/releases/23.05.3/targets/ramips/mt7620/openwrt-imagebuilder-23.05.3-ramips-mt7620.Linux-x86_64.tar.xz"

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses5-dev zlib1g-dev gawk \
            git gettext libssl-dev xsltproc rsync wget unzip python3 file

      - name: Download and verify pinned ImageBuilder
        run: |
          wget --https-only "$IB_URL" -O "$IB_ARCHIVE"
          wget --https-only "https://downloads.openwrt.org/releases/23.05.3/targets/ramips/mt7620/sha256sums" -O /tmp/sha256sums
          grep "  $IB_ARCHIVE$" /tmp/sha256sums | sha256sum -c -
          tar -xf "$IB_ARCHIVE"

      - name: Build custom firmware
        run: ./build.sh

      - name: Verify firmware, manifest, and size policy
        run: |
          test -s output/firmware.manifest
          grep -Eq '^uhttpd-mod-ubus([[:space:]]|$)' output/firmware.manifest
          grep -Eq '^rpcd-mod-iwinfo([[:space:]]|$)' output/firmware.manifest
          grep -Eq '^rpcd-mod-file([[:space:]]|$)' output/firmware.manifest
          grep -Eq '^rpcd-mod-rpcsys([[:space:]]|$)' output/firmware.manifest
          test -n "$(find output -maxdepth 1 -name '*sysupgrade.bin' -print -quit)"
          ! grep -Eq '^(dropbear|dnsmasq(-full)?|odhcpd(-[^[:space:]]*)?|odhcp6c|unbound|uhttpd-mod-tls|luci(-[^[:space:]]*)?|rpcd-mod-luci|firewall4?|nftables|iptables|ppp(-[^[:space:]]*)?|libustream-[^[:space:]]*)($|[[:space:]])' output/firmware.manifest

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: ALAMEER-K2-Dashboard-v22.5
          path: output/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release for version tags
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: output/*

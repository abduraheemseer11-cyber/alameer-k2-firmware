name: Build ALAMEER K2 Firmware

on:
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: "OpenWrt release (blank uses config.env)"
        required: false
        default: ""
      publish_release:
        description: "Create a GitHub Release after a successful verified build"
        type: boolean
        required: false
        default: false
  push:
    branches: [main]
    paths:
      - "files/**"
      - "scripts/**"
      - "packages.txt"
      - "config.env"
      - ".github/workflows/build.yml"
      - "README.md"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install ImageBuilder tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential gawk wget zstd xz-utils file python3 rsync unzip ca-certificates \
            libncurses-dev

      - name: Prepare scripts and validate project
        shell: bash
        run: |
          set -euo pipefail
          chmod 0755 scripts/*.sh files/etc/uci-defaults/* files/usr/libexec/alameer/* files/usr/sbin/alameer-wifi-diag
          bash scripts/check-scripts.sh
          bash scripts/check-project.sh

      - name: Build and size-check firmware
        id: build
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ github.event.inputs.openwrt_version }}"
          if [ -n "$VERSION" ]; then
            bash scripts/build.sh "$VERSION" 2>&1 | tee build.log
          else
            bash scripts/build.sh 2>&1 | tee build.log
          fi

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: ALAMEER-K2-firmware
          path: |
            output/ALAMEER-K2-mt7620-phicomm_k2-v22.5-sysupgrade.bin
            output/ALAMEER-K2-mt7620-phicomm_k2-v22.5-sysupgrade.bin.sha256
            output/VERSION.txt
            output/config.buildinfo
            output/*.manifest
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ALAMEER-K2-build-logs
          path: build.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish GitHub Release
        if: success() && github.event_name == 'workflow_dispatch' && inputs.publish_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: alameer-k2-${{ github.run_number }}
          name: ALAMEER K2 Firmware #${{ github.run_number }}
          files: |
            output/ALAMEER-K2-mt7620-phicomm_k2-v22.5-sysupgrade.bin
            output/ALAMEER-K2-mt7620-phicomm_k2-v22.5-sysupgrade.bin.sha256
            output/VERSION.txt

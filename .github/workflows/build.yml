name: Build Alameer K2 firmware

on:
  workflow_dispatch:
    inputs:
      version:
        description: "OpenWrt version (blank = config.env)"
        required: false
        default: ""
      release:
        description: "Publish a GitHub Release with the images"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "files/**"
      - "scripts/**"
      - "packages.txt"
      - "config.env"
      - ".github/workflows/build.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential gawk wget zstd xz-utils file python3 rsync unzip libncurses-dev

      - name: Syntax check scripts
        run: |
          sh -n files/etc/uci-defaults/99-alameer-config
          sh -n files/usr/libexec/alameer/quicksetup-apply
          bash -n scripts/build.sh

      - name: Build
        run: ./scripts/build.sh "${{ github.event.inputs.version }}"

      - name: Show size report
        run: ls -l output/

      - uses: actions/upload-artifact@v4
        with:
          name: alameer-k2-firmware
          path: output/*
          if-no-files-found: error

      - name: Read version
        id: ver
        run: |
          . ./config.env
          echo "v=${{ github.event.inputs.version }}" | sed 's/=$/='"$OPENWRT_VERSION"'/' >> "$GITHUB_OUTPUT"

      - name: Release
        if: ${{ github.event.inputs.release == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: alameer-k2-${{ steps.ver.outputs.v }}-${{ github.run_number }}
          name: Alameer K2 (OpenWrt ${{ steps.ver.outputs.v }}) #${{ github.run_number }}
          files: output/*

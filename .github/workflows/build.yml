name: Build ALAMEER K2 Firmware
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gawk unzip wget xz-utils zstd file python3 rsync
      - name: Build firmware
        run: bash build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ALAMEER-K2-firmware
          path: output/*
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ALAMEER K2 build ${{ github.run_number }}
          files: output/*

name: Build Al-Makhadhi K2 Firmware

on:
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: 'OpenWrt version'
        default: '23.05.3'
      profile:
        description: 'Device profile'
        type: choice
        default: phicomm_k2-v22.5
        options: [phicomm_k2-v22.5, phicomm_psg1218a, phicomm_psg1218b]
      variant:
        description: 'full (sqm/wol/...) or lite'
        type: choice
        default: full
        options: [full, lite]
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ github.event.inputs.openwrt_version || '23.05.3' }}
      PROFILE: ${{ github.event.inputs.profile || 'phicomm_k2-v22.5' }}
      VARIANT: ${{ github.event.inputs.variant || 'full' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev zlib1g-dev gawk git gettext \
            libssl-dev xsltproc rsync wget unzip python3 zstd xz-utils file jq
      - name: Build
        run: bash scripts/ib-build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Al-Makhadhi-K2-${{ env.PROFILE }}-${{ env.VERSION }}
          path: out/*
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*

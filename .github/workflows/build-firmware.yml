name: Build ALAMEER K2 Firmware

on:
  workflow_dispatch:
    inputs:
      openwrt_tag:
        description: "Pinned OpenWrt release tag (must contain profile phicomm_k2-v22.5)"
        required: false
        default: "v22.03.7"
      openwrt_commit:
        description: "Optional expected commit SHA of the tag (build fails if different)"
        required: false
        default: ""
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  OPENWRT_TAG: ${{ github.event.inputs.openwrt_tag || 'v22.03.7' }}
  OPENWRT_COMMIT: ${{ github.event.inputs.openwrt_commit || '' }}
  FINAL_NAME: ALAMEER-K2-mt7620-phicomm_k2-v22.5-sysupgrade.bin

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev python3 python3-distutils rsync unzip zlib1g-dev \
            file wget ca-certificates swig libelf-dev xsltproc zip

      - name: Fix script permissions
        run: |
          chmod +x scripts/*.sh files/etc/uci-defaults/* packages/luci-app-alameer/root/usr/sbin/* packages/luci-app-alameer/root/etc/init.d/* packages/alameer-watchdog/files/*
          ls -l scripts/

      - name: Check scripts (shebang, LF, explicit bash calls, works without exec bits)
        run: bash scripts/check-scripts.sh

      - name: Self-test verification gates
        run: bash scripts/selftest.sh

      - name: Static project checks (defaults, Makefile references, theme, controller)
        run: bash scripts/check-project.sh

      - name: Unit test - ALAMEER sidebar menu model
        run: node scripts/test-theme-menu.js

      - name: Build firmware (verifies device definition first)
        id: build
        run: |
          mkdir -p out
          set -o pipefail
          bash scripts/build.sh 2>&1 | tee out/build.log

      - name: Verify image (size, format, device metadata)
        id: verify
        run: |
          set -o pipefail
          IMG="$(cat build/image.path)"
          bash scripts/verify-image-size.sh "$IMG" build/openwrt 2>&1 | tee out/verify-image.log

      - name: Package release artifacts (only after verification)
        run: |
          export OPENWRT_TAG
          bash scripts/package-release.sh out

      - name: Build summary
        if: always()
        run: |
          {
            echo "## ALAMEER K2 firmware build"
            echo "- OpenWrt tag: \`$OPENWRT_TAG\`"
            [ -f build/openwrt.sha ] && echo "- OpenWrt commit: \`$(cat build/openwrt.sha)\`"
            if [ -f "out/$FINAL_NAME" ]; then
              echo "- Result: **SUCCESS** – \`$FINAL_NAME\` ($(stat -c %s out/$FINAL_NAME) bytes)"
              echo "- SHA256: \`$(cut -d' ' -f1 out/$FINAL_NAME.sha256)\`"
            else
              echo "- Result: **FAILED** – no flashable image was produced (see logs below)"
              echo; echo '```'; tail -n 40 out/build.log 2>/dev/null; echo '```'
            fi
            [ -f out/verify-image.log ] && { echo; echo '```'; cat out/verify-image.log; echo '```'; }
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload firmware artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ALAMEER-K2-firmware
          path: |
            out/${{ env.FINAL_NAME }}
            out/${{ env.FINAL_NAME }}.sha256
            out/VERSION.txt
            out/config.buildinfo
            out/*.manifest
          if-no-files-found: error

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            out/build.log
            out/verify-image.log
            build/openwrt/logs/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Create GitHub Release (tag pushes only)
        if: success() && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            "out/$FINAL_NAME" "out/$FINAL_NAME.sha256" out/VERSION.txt \
            --title "ALAMEER K2 ${{ github.ref_name }}" \
            --notes "Phicomm K2 v22.5 layout only. Read docs/INSTALLATION.md before flashing. SHA256 in the .sha256 file."

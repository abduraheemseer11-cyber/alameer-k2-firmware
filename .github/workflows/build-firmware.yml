name: Build Alameer-K2 Firmware

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Phicomm K2 (PSG1218) Image
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout project files
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses5-dev gawk git \
            libssl-dev gettext zlib1g-dev swig unzip time rsync \
            python3 python3-distutils wget file

      - name: Cache ImageBuilder tarball
        uses: actions/cache@v4
        id: ib-cache
        with:
          path: openwrt-imagebuilder-21.02.7-ramips-mt7620.Linux-x86_64.tar.xz
          key: ib-21.02.7-mt7620-v1

      - name: Download ImageBuilder
        if: steps.ib-cache.outputs.cache-hit != 'true'
        run: |
          wget -q https://downloads.openwrt.org/releases/21.02.7/targets/ramips/mt7620/openwrt-imagebuilder-21.02.7-ramips-mt7620.Linux-x86_64.tar.xz

      - name: Extract ImageBuilder
        run: |
          tar -xf openwrt-imagebuilder-21.02.7-ramips-mt7620.Linux-x86_64.tar.xz

      - name: Restructure theme package into overlay
        run: |
          set -e
          mkdir -p files/usr/lib/lua/luci/view/themes/alameer
          mkdir -p files/usr/lib/lua/luci/view/alameer
          mkdir -p files/usr/lib/lua/luci/controller
          mkdir -p files/www/luci-static/alameer

          cp -v package/luci-theme-alameer/luasrc/view/themes/alameer/*.htm \
                files/usr/lib/lua/luci/view/themes/alameer/
          cp -v package/luci-theme-alameer/luasrc/view/alameer/*.htm \
                files/usr/lib/lua/luci/view/alameer/
          cp -v package/luci-theme-alameer/luasrc/controller/*.lua \
                files/usr/lib/lua/luci/controller/
          cp -v package/luci-theme-alameer/htdocs/luci-static/alameer/* \
                files/www/luci-static/alameer/
          cp -v package/luci-theme-alameer/root/etc/uci-defaults/* \
                files/etc/uci-defaults/

      - name: Fix file permissions
        run: |
          find files/etc/uci-defaults -type f -exec chmod 755 {} \;
          find files/usr files/www -type f -exec chmod 644 {} \;
          find files/etc -type f ! -path "files/etc/uci-defaults/*" -exec chmod 644 {} \;
          find files -type d -exec chmod 755 {} \;

      - name: Verify overlay structure
        run: |
          echo "=== Overlay file tree ==="
          find files -type f | sort
          echo ""
          echo "=== Critical executables ==="
          ls -l files/etc/uci-defaults/

      - name: Copy overlay into ImageBuilder
        run: |
          cd openwrt-imagebuilder-21.02.7-ramips-mt7620.Linux-x86_64
          rm -rf files
          cp -r ../files ./files

      - name: Build firmware image
        run: |
          cd openwrt-imagebuilder-21.02.7-ramips-mt7620.Linux-x86_64
          make image \
            PROFILE="phicomm_k2-v22.4" \
            PACKAGES="luci luci-compat luci-lib-jsonc luci-i18n-base-ar luci-i18n-firewall-ar watchcat lldpd iwinfo luci-app-commands wpad-openssl -luci-app-firewall -luci-app-opkg -luci-theme-bootstrap -wpad-basic-wolfssl -wpad-basic" \
            FILES="./files" \
            DISABLED_SERVICES="dnsmasq firewall odhcpd" \
            EXTRA_IMAGE_NAME="alameer-k2-v1"

      - name: Verify image size
        run: |
          BIN_DIR="openwrt-imagebuilder-21.02.7-ramips-mt7620.Linux-x86_64/bin/targets/ramips/mt7620"
          ls -lh "$BIN_DIR"
          SYS=$(find "$BIN_DIR" -name "*-sysupgrade.bin" | head -1)
          if [ -z "$SYS" ]; then
            echo "❌ No sysupgrade image generated!"
            exit 1
          fi
          SIZE=$(stat -c%s "$SYS")
          LIMIT=$((7500 * 1024))
          echo "📦 Image size: $SIZE bytes ($(( SIZE / 1024 )) KiB)"
          echo "🔒 Safe limit: $LIMIT bytes (7500 KiB)"
          if [ "$SIZE" -gt "$LIMIT" ]; then
            echo "❌ Image exceeds 7.5MB safety limit!"
            exit 1
          fi
          echo "✅ Size OK — safe to flash"

      - name: Generate SHA256 checksums
        run: |
          BIN_DIR="openwrt-imagebuilder-21.02.7-ramips-mt7620.Linux-x86_64/bin/targets/ramips/mt7620"
          cd "$BIN_DIR"
          sha256sum *.bin > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: alameer-k2-firmware
          path: |
            openwrt-imagebuilder-21.02.7-ramips-mt7620.Linux-x86_64/bin/targets/ramips/mt7620/*.bin
            openwrt-imagebuilder-21.02.7-ramips-mt7620.Linux-x86_64/bin/targets/ramips/mt7620/SHA256SUMS.txt
          retention-days: 30

name: Build ALAMEER K2 V3

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - '.github/workflows/**'
      - 'files/**'
      - 'packages.txt'
      - 'config.env'
      - 'scripts/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev python3 python3-distutils rsync unzip zlib1g-dev \
            file wget curl ca-certificates xz-utils zstd

      - name: Static project checks
        run: |
          bash ./scripts/check-project.sh
          node --check files/www/luci-static/resources/view/alameer/quicksetup.js

      - name: Build firmware with official ImageBuilder
        run: bash ./scripts/build-imagebuilder.sh

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: ALAMEER-K2-V3-firmware
          path: |
            out/ALAMEER-K2-mt7620-phicomm_k2-v22.5-sysupgrade.bin
            out/*.sha256
            out/VERSION.txt
            out/config.buildinfo
            out/*.manifest
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ALAMEER-K2-V3-build-logs
          path: out/build.log
          if-no-files-found: ignore
          retention-days: 14
